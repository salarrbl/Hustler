<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustler - Bug Bounty Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #13131a;
            --bg-hover: #1a1a24;
            --border: #232330;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #39d4c0;
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .header h1 span { color: var(--neon-purple); }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }
        
        .stat-card .value {
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.2;
        }
        
        .stat-card.critical .value { color: var(--accent-red); }
        .stat-card.high .value { color: var(--accent-yellow); }
        .stat-card.medium .value { color: var(--accent-blue); }
        .stat-card.success .value { color: var(--accent-green); }
        
        .main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            height: calc(100vh - 120px);
        }
        
        .sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .target-form {
            display: flex;
            gap: 0.5rem;
        }
        
        .target-form input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
        }
        
        .target-form input:focus {
            outline: none;
            border-color: var(--neon-purple);
        }
        
        .target-form button {
            background: var(--neon-purple);
            border: none;
            color: #000;
            padding: 0.5rem 0.875rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: opacity 0.2s;
        }
        
        .target-form button:hover { opacity: 0.9; }
        
        .platform-section {
            padding: 0.75rem 1rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .platform-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        
        .platform-header:hover .platform-name { color: var(--neon-purple); }
        
        .platform-name {
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }
        
        .platform-icon {
            font-size: 1rem;
        }
        
        .platform-count {
            font-size: 0.7rem;
            background: var(--bg-dark);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .platform-chevron {
            font-size: 0.7rem;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }
        
        .platform-section.collapsed .platform-chevron {
            transform: rotate(-90deg);
        }
        
        .target-list {
            list-style: none;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .platform-section.collapsed .target-list {
            max-height: 0;
            opacity: 0;
        }
        
        .target-item {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 0.25rem;
        }
        
        .target-item:hover, .target-item.active {
            background: var(--bg-hover);
        }
        
        .target-item .domain {
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .target-item .domain::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon-purple);
            opacity: 0.6;
        }
        
        .target-item .status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            padding-left: 0.75rem;
        }
        
        .target-item .job-badge {
            font-size: 0.65rem;
            padding: 0.125rem 0.375rem;
            border-radius: 8px;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        
        .target-item .job-badge.running { 
            color: var(--accent-blue); 
            background: rgba(88, 166, 255, 0.15);
        }
        .target-item .job-badge.done { 
            color: var(--accent-green); 
            background: rgba(16, 185, 129, 0.15);
        }
        .target-item .job-badge.error { 
            color: var(--accent-red); 
            background: rgba(239, 68, 68, 0.15);
        }
        
        .content {
            overflow-y: auto;
            padding: 1.5rem;
            flex: 1;
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .content-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .content-actions button {
            background: var(--neon-purple);
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 0.5rem;
            font-size: 0.875rem;
        }
        
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        
        .section-header {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-header h3 {
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .section-header .count {
            background: var(--bg-dark);
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .section-body {
            max-height: 450px;
            overflow-y: auto;
        }
        
        .finding-row {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-size: 0.8125rem;
        }
        
        .finding-row:last-child { border-bottom: none; }
        .finding-row:hover { background: var(--bg-hover); }
        
        .finding-tag {
            flex-shrink: 0;
            width: 90px;
            font-weight: 500;
            font-size: 0.75rem;
        }
        
        .finding-value {
            flex: 1;
            word-break: break-all;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8125rem;
        }
        
        .finding-meta {
            color: var(--text-secondary);
            font-size: 0.7rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .tag-secret { color: var(--accent-yellow); }
        .tag-sink { color: var(--accent-red); }
        .tag-blh { color: var(--accent-green); }
        .tag-cve { color: var(--accent-purple); }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        
        .empty-state h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 0.875rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s, border-color 0.2s;
        }
        
        .refresh-btn:hover { 
            background: var(--bg-hover); 
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }
        
        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>⚡</span> Hustler</h1>
        <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
    </div>
    
    <div class="stats" id="stats">
        <div class="stat-card critical">
            <div class="label">Critical Secrets</div>
            <div class="value" id="stat-critical-secrets">-</div>
        </div>
        <div class="stat-card high">
            <div class="label">Risky Sinks</div>
            <div class="value" id="stat-high-sinks">-</div>
        </div>
        <div class="stat-card medium">
            <div class="label">BLH Vulns</div>
            <div class="value" id="stat-blh">-</div>
        </div>
        <div class="stat-card success">
            <div class="label">Targets</div>
            <div class="value" id="stat-targets">-</div>
        </div>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    Targets
                    <span id="total-targets">0</span>
                </div>
                <div class="target-form">
                    <input type="text" id="newTargetInput" placeholder="Add target domain..." onkeypress="if(event.key==='Enter') addTarget(this.value)">
                    <button onclick="addTarget(document.getElementById('newTargetInput').value)">+</button>
                </div>
            </div>
            <div id="platformList">
                <!-- Platform sections populated by JS -->
            </div>
        </div>
        
        <div class="content" id="content">
            <div class="empty-state">
                <h3>Select a target to view findings</h3>
                <p>Add a new target or select from the sidebar</p>
            </div>
        </div>
    </div>

    <script>
        let targetsByPlatform = {};
        let findings = {};
        let selectedTarget = null;
        let expandedPlatforms = {
            'hackerone': true,
            'bugcrowd': true,
            'intigriti': true,
            'yeswehack': true,
            'openbugbounty': true,
            'freelance': true
        };
        
        const platformOrder = ['hackerone', 'bugcrowd', 'intigriti', 'yeswehack', 'openbugbounty', 'freelance'];
        const platformIcons = {
            'hackerone': '◆',
            'bugcrowd': '◇',
            'intigriti': '⬢',
            'yeswehack': '⚡',
            'openbugbounty': '⬟',
            'freelance': '◆'
        };
        
        // API calls
        async function api(endpoint, options = {}) {
            const resp = await fetch(`/api${endpoint}`, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            return resp.json();
        }
        
        async function loadTargets() {
            try {
                const data = await api('/targets');
                targetsByPlatform = data.by_platform || {};
                renderTargets();
            } catch (e) { console.error('Failed to load targets:', e); }
        }
        
        async function loadFindings(targetId) {
            try {
                findings[targetId] = await api(`/findings/${targetId}`);
                renderFindings(targetId);
            } catch (e) { console.error('Failed to load findings:', e); }
        }
        
        async function addTarget(domain) {
            if (!domain) return;
            try {
                await api('/targets', { method: 'POST', body: JSON.stringify({ domain }) });
                await loadTargets();
                document.getElementById('newTargetInput').value = '';
            } catch (e) { console.error('Failed to add target:', e); }
        }
        
        async function triggerScan(targetId) {
            try {
                await api(`/jobs`, { method: 'POST', body: JSON.stringify({ target_id: targetId, source: 'manual' }) });
                await loadFindings(targetId);
            } catch (e) { console.error('Failed to trigger scan:', e); }
        }
        
        function renderTargets() {
            const container = document.getElementById('platformList');
            let totalCount = 0;
            
            container.innerHTML = platformOrder.map(platform => {
                const targets = targetsByPlatform[platform] || [];
                const count = targets.length;
                totalCount += count;
                const isExpanded = expandedPlatforms[platform] !== false;
                const icon = platformIcons[platform] || '◆';
                
                return `
                    <div class="platform-section ${isExpanded ? '' : 'collapsed'}" data-platform="${platform}">
                        <div class="platform-header" onclick="togglePlatform('${platform}')">
                            <span class="platform-name">
                                <span class="platform-icon">${icon}</span>
                                ${platform}
                            </span>
                            <span class="platform-count">${count}</span>
                            <span class="platform-chevron">▼</span>
                        </div>
                        <ul class="target-list" id="list-${platform}">
                            ${targets.map(t => `
                                <li class="target-item ${selectedTarget?.id === t.id ? 'active' : ''}" onclick="event.stopPropagation(); selectTarget('${t.id}')">
                                    <div class="domain">${t.domain}</div>
                                    <div class="status">${t.source} • ${t.status}
                                        ${t.job_status === 'running' ? '<span class="job-badge running"><span class="spinner"></span></span>' : ''}
                                        ${t.job_status === 'done' ? '<span class="job-badge done">✓</span>' : ''}
                                        ${t.job_status === 'error' ? '<span class="job-badge error">✗</span>' : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }).join('');
            
            document.getElementById('total-targets').textContent = totalCount;
            document.getElementById('stat-targets').textContent = totalCount;
        }
        
        function togglePlatform(platform) {
            expandedPlatforms[platform] = !expandedPlatforms[platform];
            const el = document.querySelector(`[data-platform="${platform}"]`);
            if (el) el.classList.toggle('collapsed');
        }
        
        function selectTarget(id) {
            // Find target in all platforms
            for (const platform of platformOrder) {
                const targets = targetsByPlatform[platform] || [];
                const found = targets.find(t => t.id === id);
                if (found) {
                    selectedTarget = found;
                    break;
                }
            }
            renderTargets();
            loadFindings(id);
        }
        
        function renderFindings(targetId) {
            const f = findings[targetId];
            if (!f) return;
            
            const content = document.getElementById('content');
            const s = f.secrets || [];
            const sk = f.sinks || [];
            const blh = f.blh || [];
            const cves = f.cves || [];
            
            // Update stats
            const criticalSecrets = s.filter(x => x.confidence >= 0.8).length;
            const highSinks = sk.filter(x => x.confidence >= 0.75 && !x.has_origin_check).length;
            const vulnBLH = blh.filter(x => !x.is_target_subdomain && ['unclaimed_s3','github_pages_missing','nxdomain'].includes(x.resolution_status)).length;
            
            document.getElementById('stat-critical-secrets').textContent = criticalSecrets;
            document.getElementById('stat-high-sinks').textContent = highSinks;
            document.getElementById('stat-blh').textContent = vulnBLH;
            
            const header = selectedTarget ? `
                <div class="content-header">
                    <h2>${selectedTarget.domain}</h2>
                    <div class="content-actions">
                        <button onclick="triggerScan('${targetId}')">▶ Re-run Scan</button>
                    </div>
                </div>
            ` : '';
            
            const secretRows = s.slice(0, 50).map(s => `
                <div class="finding-row">
                    <div class="finding-tag tag-secret">${s.pattern}</div>
                    <div class="finding-value">${escapeHtml(s.matched)}</div>
                    <div class="finding-meta">L${s.line} conf:${s.confidence.toFixed(2)}</div>
                    <div class="finding-meta">${shortUrl(s.js_file_url)}</div>
                </div>
            `).join('');
            
            const sinkRows = sk.filter(x => x.confidence >= 0.75 || !x.has_origin_check).slice(0, 50).map(sk => `
                <div class="finding-row">
                    <div class="finding-tag tag-sink">${sk.sink_type}</div>
                    <div class="finding-value">${sk.source_type ? `from ${sk.source_type}` : ''}</div>
                    <div class="finding-meta">L${sk.line} origin:${sk.has_origin_check ? '✓' : '✗'}</div>
                    <div class="finding-meta">${shortUrl(sk.js_file_url)}</div>
                </div>
            `).join('');
            
            const blhRows = blh.filter(x => !x.is_target_subdomain && ['unclaimed_s3','github_pages_missing','nxdomain'].includes(x.resolution_status)).slice(0, 20).map(b => `
                <div class="finding-row">
                    <div class="finding-tag tag-blh">${b.resolution_status}</div>
                    <div class="finding-value">${escapeHtml(b.referenced_domain)}</div>
                    <div class="finding-meta">${b.evidence}</div>
                </div>
            `).join('');
            
            const cveRows = cves.slice(0, 20).map(c => `
                <div class="finding-row">
                    <div class="finding-tag tag-cve">${c.library_name} v${c.version}</div>
                    <div class="finding-value">${escapeHtml(c.description)}</div>
                    <div class="finding-meta">${c.cve_id}</div>
                </div>
            `).join('');
            
            content.innerHTML = `
                ${header}
                ${s.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <h3>🔑 Secrets (${s.length})</h3>
                        <span class="count">${criticalSecrets} high-confidence</span>
                    </div>
                    <div class="section-body">${secretRows}${s.length > 50 ? '<div class="empty-state">...and ' + (s.length - 50) + ' more</div>' : ''}</div>
                </div>` : ''}
                
                ${sk.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <h3>⚡ Sinks (${sk.length})</h3>
                        <span class="count">${highSinks} risky</span>
                    </div>
                    <div class="section-body">${sinkRows}${sk.length > 50 ? '<div class="empty-state">...and ' + (sk.length - 50) + ' more</div>' : ''}</div>
                </div>` : ''}
                
                ${blhRows.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <h3>🌐 BLH Vulnerabilities (${blhRows.length})</h3>
                    </div>
                    <div class="section-body">${blhRows}</div>
                </div>` : ''}
                
                ${cves.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <h3>📦 Library CVEs (${cves.length})</h3>
                    </div>
                    <div class="section-body">${cveRows}</div>
                </div>` : ''}
                
                ${s.length === 0 && sk.length === 0 && blhRows.length === 0 && cves.length === 0 ? `
                <div class="empty-state">
                    <h3>No findings yet</h3>
                    <p>Run a scan to discover vulnerabilities</p>
                </div>` : ''}
            `;
        }
        
        function shortUrl(url) {
            if (!url) return '';
            try {
                const u = new URL(url);
                return u.pathname.split('/').pop() || u.hostname;
            } catch { return url.slice(-50); }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function refreshData() {
            loadTargets();
            if (selectedTarget) loadFindings(selectedTarget.id);
        }
        
        // Auto-refresh every 30s
        setInterval(() => {
            if (selectedTarget) loadFindings(selectedTarget.id);
        }, 30000);
        
        // Init
        loadTargets();
    </script>
</body>
</html>
